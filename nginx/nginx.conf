server {
    listen 80;
    server_name tempo-app.site www.tempo-app.site;
    client_max_body_size 5M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tempo-app.site$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name 85.215.200.32 _;
    client_max_body_size 5M;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name tempo-app.site www.tempo-app.site;
    client_max_body_size 5M;

    ssl_certificate /etc/letsencrypt/live/tempo-app.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tempo-app.site/privkey.pem;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
